services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
